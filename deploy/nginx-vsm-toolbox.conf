# Install nginx, replace vsm.example.com and certificate paths, then enable
# this site. Use a certificate issued by a CA trusted by your users.
# Set VSM_COOKIE_SECURE=1 in /etc/default/vsm-toolbox and restart the service.
# Keep backend port 8080 bound to loopback; do not publish it separately.
limit_conn_zone $binary_remote_addr zone=vsm_connections:10m;
limit_req_zone $binary_remote_addr zone=vsm_requests:10m rate=10r/s;

server {
    listen 80;
    server_name vsm.example.com;
    return 301 https://vsm.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name vsm.example.com;
    ssl_certificate /etc/ssl/vsm/fullchain.pem;
    ssl_certificate_key /etc/ssl/vsm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 128m;
    limit_conn vsm_connections 32;
    limit_req zone=vsm_requests burst=40 nodelay;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header Connection close;
        proxy_connect_timeout 5s;
        proxy_read_timeout 125s;
        proxy_send_timeout 30s;
        proxy_request_buffering on;
        proxy_buffering on;
    }
}
