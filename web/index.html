<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VSM Toolbox</title>
    <link rel="stylesheet" href="/style.css" />
    <link id="brandingStyles" rel="stylesheet" href="/branding.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside id="sidebar">
      <a class="brand" href="/">
        ◈
        <span>VSM Toolbox</span>
      </a>
      <div class="workspace">YOUR WORKSPACE</div>
      <button id="streamsNav" aria-label="Value streams" title="Value streams" class="nav active">▱ &nbsp; Value streams</button>
      <button id="processNav" aria-label="Process library" title="Process library" class="nav">☷ &nbsp; Process library</button>
      <div id="adminMenu" hidden>
        <div class="workspace">ADMINISTRATOR</div>
        <button id="tagsNav" aria-label="Tags &amp; categories" title="Tags &amp; categories" class="nav">◆ &nbsp; Tags &amp; categories</button>
        <button id="brandingNav" aria-label="Branding &amp; theme" title="Branding &amp; theme" class="nav">◈ &nbsp; Branding &amp; theme</button>
        <button id="accountsNav" aria-label="Account administration" title="Account administration" class="nav">♙ &nbsp; Account administration</button>
        <button id="backupsNav" aria-label="Backups &amp; restore" title="Backups &amp; restore" class="nav">▣ &nbsp; Backups &amp; restore</button>
        <button id="updatesNav" aria-label="Application updates" title="Application updates" class="nav">↻ &nbsp; Application updates</button>
      </div>
      <div class="aside-bottom">
        LOCAL WORKSPACE
        <br />
        <span>● Data stays on your server</span>
      </div>
    </aside>
    <main>
      <header>
        <div class="header-navigation">
          <button id="sidebarToggle" type="button" aria-label="Collapse menu" aria-controls="sidebar" aria-expanded="true" title="Collapse menu">☰ <span>Collapse menu</span></button>
          <span>
          Workspace /
          <b id="breadcrumb">Value streams</b>
          </span>
        </div>
        <div id="identity"></div>
      </header>
      <section id="content"></section>
      <div id="error" role="alert" hidden></div>
    </main>
    <dialog id="editor">
      <form id="form">
        <div class="dialog-top">
          <h2 id="dialogTitle"></h2>
          <button type="button" id="closeDialog" aria-label="Close">×</button>
        </div>
        <div id="fields"></div>
        <div class="dialog-actions">
          <button type="button" id="cancelDialog">Cancel</button>
          <button class="primary" type="submit">Save changes</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
